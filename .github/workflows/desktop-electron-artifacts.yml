name: desktop-electron-artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop build version"
        required: false
        default: "0.0.0-dev-202605041726"
        type: string

concurrency: desktop-electron-artifacts-${{ github.ref }}-${{ inputs.version }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    env:
      LIZ_CHANNEL: dev
      LIZ_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Build renderer and main process
        working-directory: packages/desktop-electron
        run: bun run build

      - name: Package Windows installer
        working-directory: packages/desktop-electron
        run: bun run package:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liz-Dev-Studio-Windows
          path: |
            packages/desktop-electron/dist/*.exe
            packages/desktop-electron/dist/*.blockmap
          if-no-files-found: error

  linux:
    name: Linux AppImage deb rpm
    runs-on: ubuntu-latest
    env:
      LIZ_CHANNEL: dev
      LIZ_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools

      - name: Build renderer and main process
        working-directory: packages/desktop-electron
        run: bun run build

      - name: Package Linux artifacts
        working-directory: packages/desktop-electron
        run: bun run package:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Liz-Dev-Studio-Linux
          path: |
            packages/desktop-electron/dist/*.AppImage
            packages/desktop-electron/dist/*.deb
            packages/desktop-electron/dist/*.rpm
            packages/desktop-electron/dist/*.blockmap
          if-no-files-found: error

  macos:
    name: macOS DMG zip
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      LIZ_CHANNEL: dev
      LIZ_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Build renderer and main process
        working-directory: packages/desktop-electron
        run: bun run build

      - name: Package unsigned macOS artifacts
        working-directory: packages/desktop-electron
        run: |
          bunx electron-builder --mac dmg zip --publish never --config electron-builder.config.ts -c.mac.identity=null -c.mac.notarize=false -c.dmg.sign=false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Liz-Dev-Studio-macOS
          path: |
            packages/desktop-electron/dist/*.dmg
            packages/desktop-electron/dist/*.zip
            packages/desktop-electron/dist/*.blockmap
          if-no-files-found: error
