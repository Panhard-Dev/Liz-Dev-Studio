name: npm-publish-retry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true
        default: "0.0.0-dev-202605040039"
      channel:
        description: "npm dist-tag for platform packages"
        required: true
        default: "dev"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Build CLI packages
        run: bun run build
        working-directory: packages/liz
        env:
          LIZ_VERSION: ${{ inputs.version }}
          LIZ_CHANNEL: ${{ inputs.channel }}

      - name: Publish missing npm packages
        run: bun run publish:npm
        working-directory: packages/liz
        env:
          LIZ_VERSION: ${{ inputs.version }}
          LIZ_CHANNEL: ${{ inputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: false

      - name: Make public CLI installable without a tag
        run: npm dist-tag add liz-ai-brasil@${{ inputs.version }} latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
