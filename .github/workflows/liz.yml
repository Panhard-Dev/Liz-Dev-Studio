name: liz

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  liz:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /liz') ||
      startsWith(github.event.comment.body, '/liz')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run liz
        uses: anomalyco/liz/github@latest
        env:
          LIZ_API_KEY: ${{ secrets.LIZ_API_KEY }}
          LIZ_PERMISSION: '{"bash": "deny"}'
        with:
          model: liz/claude-opus-4-5
